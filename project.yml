# YiPlayer — XcodeGen project (v1 skeleton)
# Generates YiPlayer.xcodeproj. No Swift Package dependencies (SPM deps: 0)
# on purpose: the first GitHub Actions build has fewer failure modes.
# Local:  xcodegen generate   (macOS + Xcode only)
# CI:     see .github/workflows/build-ios.yml
name: YiPlayer
options:
  bundleIdPrefix: com.yiplayer
  deploymentTarget:
    iOS: "17.0"
  # No xcodeVersion pin: macos-15 runners ship Xcode 16.2+, and a pin
  # to "16.0" makes `xcodegen generate` fail on version mismatch.
settings:
  base:
    PRODUCT_NAME: YiPlayer
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad 通用（用户 2026-11-27 决定：先做手机+iPad 通用 IPA，测试没问题后再做 tvOS）
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # No ASSETCATALOG_COMPILER_APPICON_NAME / AccentColor: v1 ships no
    # Assets.xcassets, so there is no AppIcon yet (test build only;
    # the icon is blank until a real AppIcon set is added).
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  YiPlayer-iOS:
    type: application
    platform: iOS
    bundleId: com.yiplayer.app
    sources:
      - path: App
      - path: YiCore
      - path: Runtime
      - path: Player
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: YiPlayer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # No UILaunchStoryboardName here: App/Info.plist declares a
        # UILaunchScreen instead. No NSAppTransportSecurity here either:
        # the nested dict lives directly in App/Info.plist, where it
        # cannot be lost in XcodeGen's INFOPLIST_KEY conversion.
        # Privacy: the app plays user-supplied streams; it does not track.
        # No camera / mic / photo-library usage in v1.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiplayer.app
        INFOPLIST_FILE: App/Info.plist
schemes:
  YiPlayer-iOS:
    build:
      targets:
        YiPlayer-iOS: all
    run:
      config: Debug
    archive:
      config: Release
