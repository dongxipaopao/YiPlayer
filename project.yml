# YiPlayer — XcodeGen project (v2)
# Generates YiPlayer.xcodeproj. No Swift Package dependencies (SPM deps: 0)
# on purpose: the first GitHub Actions build has fewer failure modes.
# Local:  xcodegen generate   (macOS + Xcode only)
# CI:     see .github/workflows/build-ios.yml
#
# v2 additions vs v1:
#  - YiPlayer.xcassets (white + Y film + alpaca icon, generated 2026-11-27)
#    wired in: ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon.
#  - Runtime/PythonHost (C bridge + Swift host) and Runtime/NodeHost
#    (Swift + .mm bridge) are compiled from Runtime/ (already in sources).
#  - Two vendored xcframeworks, downloaded by CI into vendor/ (NOT
#    committed — see Scripts/fetch-python.sh and Scripts/fetch-node-mobile.sh):
#    vendor/Python.xcframework (BeeWare Python-Apple-support 3.13) and
#    vendor/NodeMobile.xcframework (jo32/nodejs-mobile 26.13.0).
#    `xcodegen generate` FAILS if vendor/ is missing: that is deliberate,
#    so a failed download can never silently produce a build without py/cat.
#  - Resources: spiders/ as a folder reference (keeps base/ layout),
#    host.mjs + worker.mjs as bundle resources.
#  - SWIFT_OBJC_BRIDGING_HEADER for the two C bridges.
#  - HEADER_SEARCH_PATHS for the NodeMobile slice Headers (the exact
#    <node/node.h> layout is UNVERIFIED — first CI log decides).
#  - ATS keys are set here AND in App/Info.plist (belt and braces; the
#    v1 ATS error for http://www.y456y.com happened even though the key
#    was already in Info.plist — see BUILD_NOTES.md).
name: YiPlayer
options:
  bundleIdPrefix: com.yiplayer
  deploymentTarget:
    iOS: "17.0"
  # No xcodeVersion pin: macos-15 runners ship Xcode 16.2+, and a pin
  # to "16.0" makes `xcodegen generate` fail on version mismatch.
settings:
  base:
    PRODUCT_NAME: YiPlayer
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad 通用（用户 2026-11-27 决定：先做手机+iPad 通用 IPA，测试没问题后再做 tvOS）
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # No ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: the xcassets has no
    # AccentColor set — do not add this key until one exists.
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  YiPlayer-iOS:
    type: application
    platform: iOS
    bundleId: com.yiplayer.app
    sources:
      - path: App
      - path: YiCore
      - path: Runtime
        excludes:
          # Resources, not sources: listed explicitly below so their
          # build phase is unambiguous (folder reference for spiders/,
          # bundle resources for the .mjs files).
          - PythonHost/spiders
          - NodeHost/host.mjs
          - NodeHost/worker.mjs
      - path: Player
      - path: YiPlayer.xcassets
      - path: Runtime/PythonHost/spiders
        type: folder
      - path: Runtime/NodeHost/host.mjs
        buildPhase: resources
      - path: Runtime/NodeHost/worker.mjs
        buildPhase: resources
    dependencies:
      # Vendored xcframeworks, downloaded by CI into vendor/ (not committed).
      # embed: true -> copied into the .app's Frameworks/ at build time.
      - framework: vendor/Python.xcframework
        embed: true
      - framework: vendor/NodeMobile.xcframework
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: YiPlayer
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # App Transport Security — also in App/Info.plist (deliberate
        # duplicate: the v1 error showed the Info.plist key alone was
        # not enough in the user's install). User-supplied video sources
        # are mostly http, and the cat server + HLS proxy run on
        # 127.0.0.1 loopback.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # No UILaunchStoryboardName here: App/Info.plist declares a
        # UILaunchScreen instead.
        # Privacy: the app plays user-supplied streams; it does not track.
        # No camera / mic / photo-library usage in v2.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiplayer.app
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Runtime/PythonHost/YiPlayer-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/vendor"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # NodeMobile headers: verified 2026-11-27 against the real
        # nodejs-mobile-v26.13.0-apple.zip — the xcframework ships
        # ONLY NodeMobile.h (declaring node_start); there is no
        # node/node.h anywhere, so NodeBridge.mm imports
        # <NodeMobile/NodeMobile.h> through FRAMEWORK_SEARCH_PATHS
        # and needs no HEADER_SEARCH_PATHS entries.
schemes:
  YiPlayer-iOS:
    build:
      targets:
        YiPlayer-iOS: all
    run:
      config: Debug
    archive:
      config: Release
